name: Refresh farm data from OpenStreetMap

# Rebuilds data/osm/ (nationwide farm tiles) from Geofabrik's US extracts,
# commits any changes, and deploys. Runs monthly or on demand.

on:
  schedule:
    - cron: "17 6 3 * *" # 3rd of each month, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: refresh-farm-data
  cancel-in-progress: false

env:
  PROJECT_ID: vaschuk-com
  WIF_PROVIDER: projects/1059072294008/locations/global/workloadIdentityPools/github/providers/farms-repo
  SERVICE_ACCOUNT: farms-deployer@vaschuk-com.iam.gserviceaccount.com

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Extract farms from each US region
        run: |
          mkdir -p work
          for region in us-northeast us-midwest us-south us-west us-pacific; do
            echo "::group::$region"
            curl -sSfL --retry 3 -o work/$region.osm.pbf \
              "https://download.geofabrik.de/north-america/$region-latest.osm.pbf"
            osmium tags-filter work/$region.osm.pbf \
              nwr/shop=farm nwr/landuse=orchard nwr/pick_your_own=yes nwr/attraction=farm \
              -o work/$region.farms.pbf --overwrite
            rm work/$region.osm.pbf
            osmium export work/$region.farms.pbf -f geojsonseq \
              --geometry-types=point,polygon -o work/$region.geojsonseq --overwrite
            rm work/$region.farms.pbf
            wc -l work/$region.geojsonseq
            echo "::endgroup::"
          done

      - name: Build tiles
        run: python3 scripts/build_osm_tiles.py data/osm work/*.geojsonseq

      - name: Commit if changed
        id: commit
        run: |
          git add data/osm
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No data changes."
          else
            git -c user.name="farm-data-bot" -c user.email="actions@users.noreply.github.com" \
              commit -m "Refresh farm data from OpenStreetMap ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy here.
      - uses: google-github-actions/auth@v2
        if: steps.commit.outputs.changed == 'true'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        if: steps.commit.outputs.changed == 'true'
        with:
          node-version: 20

      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        run: npx -y firebase-tools@latest deploy --only hosting --project "$PROJECT_ID" --non-interactive
